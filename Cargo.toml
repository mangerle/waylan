[workspace]
resolver = "2"
members = [
    "crates/waylan-core",
    "crates/waylan-algo",
    "crates/waylan-ui",
    "crates/waylan-wayland",
    "crates/waylan-daemon",
    "crates/waylan-settings",
    "crates/waylan-voice",
    "crates/waylan-ibus",
    "crates/waylan-engine",
    "crates/waylan-sys",
    "tools/waylan-bigram-builder",
]

[workspace.package]
version = "1.5.1"
edition = "2024"
authors = ["WayLan Contributors"]
license = "Apache-2.0"
description = "微澜 (WayLan) - 专为 Wayland 打造的现代轻量纯 Rust 中文输入法"

[workspace.dependencies]
cpal = "0.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
chrono = "0.4"
thiserror = "2.0.21"
memmap2 = "0.9"
jieba-rs = "0.11.0"
rayon = "1.8"
regex = "1.10"
tiny-skia = "0.12.0"
cosmic-text = "0.19"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
tempfile = "3"
rustix = { version = "1.1.6", features = ["event", "fs", "shm", "process"] }
toml = "1.2.2"
fern = "0.7"
zbus = { version = "6.5.0", features = ["ibus"] }
signal-hook = "0.4.6"
slint = "1"
slint-build = "1"
sherpa-onnx = "2.0.3"
ureq = { version = "3.5.2", features = ["json"] }
parking_lot = "0.13.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

