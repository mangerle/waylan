[workspace]
resolver = "2"
members = [
    "crates/waylan-core",
    "crates/waylan-algo",
    "crates/waylan-ui",
    "crates/waylan-wayland",
    "crates/waylan-daemon",
    "crates/waylan-settings",
    "crates/waylan-voice",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["WayLan Contributors"]
license = "MIT OR Apache-2.0"
description = "微澜 (WayLan) - 专为 Wayland 打造的现代轻量纯 Rust 中文输入法"

[workspace.dependencies]
cpal = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
chrono = "0.4"
bincode = "1.3"
thiserror = "1.0"
memmap2 = "0.9"
jieba-rs = "0.7"
rayon = "1.8"
regex = "1.10"
tiny-skia = "0.11"
cosmic-text = "0.19"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
tempfile = "3"
rustix = { version = "0.38", features = ["event", "fs", "shm", "process"] }
toml = "0.8"
fern = "0.7"
zbus = "4"
signal-hook = "0.3"
slint = "1"
slint-build = "1"
sherpa-onnx = "1.13.8"
ureq = { version = "2.12", features = ["json"] }

