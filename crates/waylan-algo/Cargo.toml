[package]
name = "waylan-algo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "微澜 (WayLan) - 纯 Rust 现代中文拼音输入核心算法库"

[features]
default = []
tools = []
corpus-builder = ["dep:jieba-rs", "dep:rayon", "dep:regex", "dep:serde_json"]

[[bin]]
name = "build_bigram"
path = "src/bin/build_bigram/main.rs"
required-features = ["corpus-builder"]

[[example]]
name = "build_aux_dict"
path = "examples/build_aux_dict.rs"
required-features = ["tools"]

[[example]]
name = "build_base_dict"
path = "examples/build_base_dict.rs"
required-features = ["tools"]

[dependencies]
waylan-core = { path = "../waylan-core" }
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
log.workspace = true
memmap2.workspace = true
chrono.workspace = true
jieba-rs = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rustix.workspace = true
