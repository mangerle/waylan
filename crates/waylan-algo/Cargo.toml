[package]
name = "waylan-algo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "微澜 (WayLan) - 纯 Rust 现代中文拼音输入核心算法库"

[features]
default = []
dict-builder = []
tools = ["dict-builder"]
eval-bench = []

[[example]]
name = "eval_bench"
path = "examples/eval_bench.rs"
required-features = ["eval-bench"]

[[example]]
name = "build_aux_dict"
path = "examples/build_aux_dict.rs"
required-features = ["tools"]

[[example]]
name = "build_base_dict"
path = "examples/build_base_dict.rs"
required-features = ["tools"]

[[example]]
name = "bench_dat"
path = "examples/bench_dat.rs"
required-features = ["tools"]

[dependencies]
waylan-core = { path = "../waylan-core" }
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
log.workspace = true
memmap2.workspace = true
chrono.workspace = true
rustix.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tempfile.workspace = true
