[package]
name = "waylan-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "微澜 (WayLan) 输入法主守护进程服务"
default-run = "waylan"

[[bin]]
name = "waylan"
path = "src/main.rs"

[[bin]]
name = "waylan-settings"
path = "src/bin/settings.rs"

[dependencies]
waylan-core = { path = "../waylan-core" }
waylan-algo = { path = "../waylan-algo" }
waylan-ui = { path = "../waylan-ui" }
waylan-wayland = { path = "../waylan-wayland" }
toml.workspace = true
serde.workspace = true
log.workspace = true
fern.workspace = true
chrono.workspace = true
zbus.workspace = true
egui.workspace = true
eframe.workspace = true
signal-hook.workspace = true
