[package]
name = "waylan-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "微澜 (WayLan) 输入法主守护进程服务"
default-run = "waylan"

[[bin]]
name = "waylan"
path = "src/main.rs"

[[bin]]
name = "waylan-dict"
path = "src/bin/waylan_dict.rs"
required-features = ["admin-tools"]

[features]
default = []
admin-tools = ["waylan-algo/tools"]

[dependencies]
waylan-core = { path = "../waylan-core" }
waylan-algo = { path = "../waylan-algo" }
waylan-engine = { path = "../waylan-engine" }
waylan-ui = { path = "../waylan-ui" }
waylan-wayland = { path = "../waylan-wayland" }
waylan-ibus = { path = "../waylan-ibus" }
waylan-voice = { path = "../waylan-voice" }
waylan-sys = { path = "../waylan-sys" }
toml.workspace = true
serde.workspace = true
log.workspace = true
fern.workspace = true
chrono.workspace = true
zbus.workspace = true
signal-hook.workspace = true
rustix.workspace = true
thiserror.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.deb]
name = "waylan"
revision = ""
maintainer = "WayLan Contributors <waylan@localhost>"
copyright = "2026, WayLan Contributors"
extended-description = """
微澜 (WayLan) 是一款面向现代 Linux Wayland 合成器（Hyprland、Sway、KDE、GNOME）
设计的轻量级中文拼音输入法守护进程。具备智能算法、首字母简拼、剪贴板联动、
日期时间二级展开和图形化偏好设置中心。
"""
depends = "$auto"
section = "utils"
priority = "optional"
maintainer-scripts = "../../debian"
assets = [
    ["target/release/waylan", "usr/bin/waylan", "755"],
    ["target/release/waylan-dict", "usr/bin/waylan-dict", "755"],
    ["target/release/waylan-settings", "usr/bin/waylan-settings", "755"],
    ["../../data/base.dict.bin", "usr/share/waylan/data/base.dict.bin", "644"],
    ["../../data/aux.dict.bin", "usr/share/waylan/data/aux.dict.bin", "644"],
    ["../../data/bigram.table.bin", "usr/share/waylan/data/bigram.table.bin", "644"],
    ["../../data/opencc.dict.bin", "usr/share/waylan/data/opencc.dict.bin", "644"],
    ["../../data/dicts/8_opencc/*", "usr/share/waylan/dicts/8_opencc/", "644"],
    ["../../models/vad/**/*", "usr/share/waylan/models/vad/", "644"],
    ["../../models/ns/**/*", "usr/share/waylan/models/ns/", "644"],
    ["../../target/generated/ibus/waylan.xml", "usr/share/ibus/component/waylan.xml", "644"],
    ["../../assets/*.svg", "usr/share/waylan/assets/", "644"],
    ["../../assets/*.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../assets/waylan.svg", "usr/share/icons/hicolor/scalable/apps/waylan-settings.svg", "644"],
    ["../../assets/icons/app/waylan-32.png", "usr/share/icons/hicolor/32x32/apps/waylan.png", "644"],
    ["../../assets/icons/app/waylan-32.png", "usr/share/icons/hicolor/32x32/apps/waylan-settings.png", "644"],
    ["../../assets/icons/app/waylan-48.png", "usr/share/icons/hicolor/48x48/apps/waylan.png", "644"],
    ["../../assets/icons/app/waylan-48.png", "usr/share/icons/hicolor/48x48/apps/waylan-settings.png", "644"],
    ["../../assets/icons/app/waylan-64.png", "usr/share/icons/hicolor/64x64/apps/waylan.png", "644"],
    ["../../assets/icons/app/waylan-64.png", "usr/share/icons/hicolor/64x64/apps/waylan-settings.png", "644"],
    ["../../assets/icons/app/waylan-128.png", "usr/share/icons/hicolor/128x128/apps/waylan.png", "644"],
    ["../../assets/icons/app/waylan-128.png", "usr/share/icons/hicolor/128x128/apps/waylan-settings.png", "644"],
    ["../../assets/icons/app/waylan-256.png", "usr/share/icons/hicolor/256x256/apps/waylan.png", "644"],
    ["../../assets/icons/app/waylan-256.png", "usr/share/icons/hicolor/256x256/apps/waylan-settings.png", "644"],
    ["../../assets/icons/app/waylan-512.png", "usr/share/icons/hicolor/512x512/apps/waylan.png", "644"],
    ["../../assets/icons/app/waylan-512.png", "usr/share/icons/hicolor/512x512/apps/waylan-settings.png", "644"],
    ["../../assets/icons/app/waylan-48.png", "usr/share/pixmaps/waylan.png", "644"],
    ["../../assets/icons/app/waylan-48.png", "usr/share/pixmaps/waylan-settings.png", "644"],
    ["../../assets/waylan.svg", "usr/share/pixmaps/waylan-settings.svg", "644"],
    ["../../assets/waylan.desktop", "usr/share/applications/waylan.desktop", "644"],
    ["../../assets/waylan-settings.desktop", "usr/share/applications/waylan-settings.desktop", "644"],
    ["../../assets/waylan-autostart.desktop", "etc/xdg/autostart/waylan.desktop", "644"],
    ["../../systemd/user/waylan.service", "usr/lib/systemd/user/waylan.service", "644"],
    ["../../assets/gnome-extension/metadata.json", "usr/share/gnome-shell/extensions/waylan-hide-input-source@waylan.org/metadata.json", "644"],
    ["../../assets/gnome-extension/extension.js", "usr/share/gnome-shell/extensions/waylan-hide-input-source@waylan.org/extension.js", "644"],
    ["../../assets/gnome-extension/stylesheet.css", "usr/share/gnome-shell/extensions/waylan-hide-input-source@waylan.org/stylesheet.css", "644"],
]
